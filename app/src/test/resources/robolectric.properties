# Use the plain framework Application rather than PodcasterApp.
#
# Robolectric instantiates whatever <application> the merged manifest names, and PodcasterApp's
# onCreate() builds the real AppContainer (an on-disk Room database) and schedules a WorkManager
# job - which throws here, since WorkManager is never initialized in a JVM test. These tests
# assemble the collaborators they need themselves, so the app's real graph is not just unnecessary
# but actively wrong: it would put a shared on-disk database underneath tests that must be isolated.
application=android.app.Application
